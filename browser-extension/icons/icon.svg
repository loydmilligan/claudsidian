<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background: Obsidian Crystal - ENLARGED to fill space -->
  <defs>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3a6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1f47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1025;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crystal body - hexagonal gem shape - FULL BLEED -->
  <polygon
    points="64,0 124,32 124,96 64,128 4,96 4,32"
    fill="url(#crystalGrad)"
    stroke="#6d5a8a"
    stroke-width="2"
  />

  <!-- Crystal facet lines -->
  <line x1="64" y1="0" x2="64" y2="64" stroke="#5a4a7a" stroke-width="1.5" opacity="0.6"/>
  <line x1="124" y1="32" x2="64" y2="64" stroke="#5a4a7a" stroke-width="1.5" opacity="0.6"/>
  <line x1="124" y1="96" x2="64" y2="64" stroke="#5a4a7a" stroke-width="1.5" opacity="0.6"/>
  <line x1="64" y1="128" x2="64" y2="64" stroke="#5a4a7a" stroke-width="1.5" opacity="0.6"/>
  <line x1="4" y1="96" x2="64" y2="64" stroke="#5a4a7a" stroke-width="1.5" opacity="0.6"/>
  <line x1="4" y1="32" x2="64" y2="64" stroke="#5a4a7a" stroke-width="1.5" opacity="0.6"/>

  <!-- AI Spark / Neural node in center -->
  <g filter="url(#glow)">
    <!-- Central glowing orb -->
    <circle cx="64" cy="64" r="18" fill="url(#sparkGrad)" opacity="0.9"/>

    <!-- Inner bright core -->
    <circle cx="64" cy="64" r="10" fill="#c4b5fd" opacity="0.8"/>
    <circle cx="64" cy="64" r="5" fill="#ede9fe" opacity="0.9"/>

    <!-- Neural connection lines radiating out -->
    <g stroke="#a78bfa" stroke-width="2.5" opacity="0.7">
      <line x1="64" y1="46" x2="64" y2="22"/>
      <line x1="80" y1="54" x2="102" y2="38"/>
      <line x1="80" y1="74" x2="102" y2="90"/>
      <line x1="64" y1="82" x2="64" y2="106"/>
      <line x1="48" y1="74" x2="26" y2="90"/>
      <line x1="48" y1="54" x2="26" y2="38"/>
    </g>

    <!-- Small nodes at connection endpoints -->
    <g fill="#c4b5fd">
      <circle cx="64" cy="22" r="4"/>
      <circle cx="102" cy="38" r="4"/>
      <circle cx="102" cy="90" r="4"/>
      <circle cx="64" cy="106" r="4"/>
      <circle cx="26" cy="90" r="4"/>
      <circle cx="26" cy="38" r="4"/>
    </g>
  </g>
</svg>
