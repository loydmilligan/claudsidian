<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Add to Research Subject</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .icon {
      font-size: 20px;
    }
    .url {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      margin-bottom: 16px;
      max-height: 32px;
      overflow: hidden;
      background: #f3f4f6;
      padding: 6px 8px;
      border-radius: 4px;
    }

    /* Subject selection */
    .section-label {
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      margin-bottom: 12px;
    }
    select:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1);
    }

    /* New subject input */
    .new-subject-section {
      display: none;
      margin-bottom: 12px;
    }
    .new-subject-section.show {
      display: block;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1);
    }
    .hint {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 4px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button.primary {
      background: #7c3aed;
      color: white;
    }
    button.primary:hover {
      background: #6d28d9;
    }
    button.primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    button.secondary {
      background: #e5e7eb;
      color: #374151;
    }
    button.secondary:hover {
      background: #d1d5db;
    }

    /* Status */
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .status.loading {
      background: #e0e7ff;
      color: #3730a3;
    }
    .hidden {
      display: none;
    }

    /* Loading state */
    .loading-subjects {
      text-align: center;
      padding: 20px;
      color: #6b7280;
      font-size: 13px;
    }

    /* Subject info badge */
    .subject-info {
      font-size: 10px;
      color: #6b7280;
      margin-left: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 9px;
      margin-left: 4px;
    }
    .badge.pending {
      background: #fef3c7;
      color: #92400e;
    }
    .badge.notes {
      background: #e0e7ff;
      color: #3730a3;
    }
  </style>
</head>
<body>
  <h1><span class="icon">🎯</span> Add to Research</h1>
  <div class="url" id="current-url">Loading...</div>

  <div id="loading-state" class="loading-subjects">
    Loading subjects...
  </div>

  <div id="main-content" class="hidden">
    <div class="section-label">Select Research Subject</div>
    <select id="subject-select">
      <option value="">Choose a subject...</option>
      <option value="__new__">+ Create New Subject</option>
    </select>

    <div class="new-subject-section" id="new-subject-section">
      <div class="section-label">New Subject Name</div>
      <input type="text" id="new-subject-name" placeholder="e.g., Machine Learning Basics">
      <div class="hint">Will be set up in the Obsidian Research tab</div>
    </div>

    <div class="buttons">
      <button class="secondary" id="cancel-btn">Cancel</button>
      <button class="primary" id="capture-btn" disabled>Capture</button>
    </div>
  </div>

  <div class="status hidden" id="status"></div>

  <script src="research-popup.js"></script>
</body>
</html>
