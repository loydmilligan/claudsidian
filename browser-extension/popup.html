<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claudsidian Capture</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #1f2937;
    }
    .url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-bottom: 12px;
      max-height: 40px;
      overflow: hidden;
      background: #f3f4f6;
      padding: 8px;
      border-radius: 4px;
    }

    /* Options section */
    .options {
      margin-bottom: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px;
    }
    .option-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .option-row:last-child {
      margin-bottom: 0;
    }
    .option-label {
      font-size: 12px;
      color: #374151;
      width: 60px;
      flex-shrink: 0;
    }
    select {
      flex: 1;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      background: white;
    }
    .model-stats {
      font-size: 10px;
      color: #6b7280;
      margin-left: 8px;
      white-space: nowrap;
    }

    /* Checkbox row */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .checkbox-label {
      font-size: 12px;
      color: #374151;
      cursor: pointer;
    }
    .checkbox-hint {
      font-size: 10px;
      color: #9ca3af;
      margin-left: auto;
    }

    /* Toggle for advanced options */
    .toggle-advanced {
      font-size: 11px;
      color: #6b7280;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toggle-advanced:hover {
      color: #4b5563;
    }
    .advanced-options {
      display: none;
      border-top: 1px solid #e5e7eb;
      padding-top: 8px;
      margin-top: 8px;
    }
    .advanced-options.show {
      display: block;
    }

    /* Slider */
    .slider-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .slider-value {
      font-size: 11px;
      color: #6b7280;
      width: 30px;
      text-align: right;
    }
    input[type="range"] {
      flex: 1;
      margin: 0 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover {
      background: #6d28d9;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    button.secondary {
      background: #e5e7eb;
      color: #374151;
      margin-top: 8px;
      padding: 8px;
      font-size: 14px;
    }
    button.secondary:hover {
      background: #d1d5db;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .status.loading {
      background: #e0e7ff;
      color: #3730a3;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Claudsidian</h1>
  <div class="url" id="current-url">Loading...</div>

  <div class="options">
    <!-- Model selection -->
    <div class="option-row">
      <span class="option-label">Model</span>
      <select id="model-select">
        <option value="">Default</option>
      </select>
      <span class="model-stats" id="model-stats"></span>
    </div>

    <!-- Inbox checkbox -->
    <div class="checkbox-row">
      <input type="checkbox" id="inbox-check">
      <label class="checkbox-label" for="inbox-check">Quick capture (no AI)</label>
      <span class="checkbox-hint">Inbox mode</span>
    </div>

    <!-- Advanced options toggle -->
    <div class="toggle-advanced" id="toggle-advanced">
      <span>&#9660;</span> Advanced
    </div>
    <div class="advanced-options" id="advanced-options">
      <div class="slider-row">
        <span class="option-label">Temp</span>
        <input type="range" id="temperature" min="0" max="100" value="70">
        <span class="slider-value" id="temp-value">0.7</span>
      </div>
    </div>
  </div>

  <button id="capture-btn">Capture Page</button>
  <div class="status hidden" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
