<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claudsidian Capture</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      color: #1f2937;
    }
    .url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-bottom: 12px;
      max-height: 40px;
      overflow: hidden;
      background: #f3f4f6;
      padding: 8px;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover {
      background: #6d28d9;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .status.loading {
      background: #e0e7ff;
      color: #3730a3;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Claudsidian</h1>
  <div class="url" id="current-url">Loading...</div>
  <button id="capture-btn">Capture Page</button>
  <div class="status hidden" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
